stages:
  preprocess:
    cmd: python preprocess.py
    deps:
      - preprocess.py
      - data/raw/
    outs:
      - data/processed/

  train:
    cmd: python train.py
    deps:
      - train.py
      - data/processed/
    outs:
      - models/
    metrics:
      - metrics.json
        cache: false

  evaluate:
    cmd: python evaluate.py
    deps:
      - evaluate.py
      - models/
    metrics:
      - eval_metrics.json
        cache: false
